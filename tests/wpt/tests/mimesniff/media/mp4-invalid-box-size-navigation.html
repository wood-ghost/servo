<!doctype html>
<meta charset="utf-8">
<title>Navigation with an MP4 ftyp box containing no compatible brands</title>
<link rel="help" href="https://mimesniff.spec.whatwg.org/#matches-the-signature-for-mp4">
<link rel="help" href="https://html.spec.whatwg.org/multipage/#navigate-media">
<meta name="variant" content="?box_size=12">
<meta name="variant" content="?box_size=16">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
const boxSize = new URLSearchParams(location.search).get("box_size") || "12";

async_test(t => {
  assert_in_array(boxSize, ["12", "16"]);
  const filename = boxSize === "12" ?
    "undersized-ftyp.mp4" : "ftyp-no-compatible-brands.mp4";
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  iframe.onload = t.step_func_done(() => {
    assert_equals(iframe.contentWindow.location.href, iframe.src,
                  "The iframe must finish navigating to the MP4 response");
    assert_not_equals(iframe.contentDocument.querySelector("video"), null,
                      "The supplied video/mp4 type must produce a media document");
  });
  iframe.onerror = t.unreached_func("The MP4 navigation failed");

  // Navigate to exercise MIME sniffing before creating the media document.
  // An audio/video element alone does not exercise the navigation sniffer.
  iframe.src = `resources/${filename}?pipe=header(Content-Type,video/mp4)`;
  document.body.append(iframe);
}, `Navigation completes for an ftyp/isom box with box_size ${boxSize}`);
</script>
